name: Release images

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/scs-${{ matrix.service }}:${{ github.ref_name }}

      - name: Prune old image versions (keep last 3)
        uses: actions/delete-package-versions@v5
        with:
          package-name: scs-${{ matrix.service }}
          package-type: container
          min-versions-to-keep: 3

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Images

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/scs-api:${{ github.ref_name }}
            docker pull ghcr.io/${{ github.repository_owner }}/scs-worker:${{ github.ref_name }}
            ```
