services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scs
      POSTGRES_PASSWORD: scs
      POSTGRES_DB: shekse_code_sync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scs -d shekse_code_sync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scs:scs@postgres:5432/shekse_code_sync?schema=public
      REDIS_URL: redis://redis:6379
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scs:scs@postgres:5432/shekse_code_sync?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    environment:
      API_BASE_URL: http://api:3001
      # `web` queries Prisma directly (Auth.js user upsert in auth.ts), same
      # as api/worker - without this it falls back to .env's localhost value,
      # which doesn't resolve inside the container.
      DATABASE_URL: postgresql://scs:scs@postgres:5432/shekse_code_sync?schema=public
      # `next start` runs Auth.js in production mode, which refuses to trust
      # the request Host header unless told to - dev mode (`next dev`) trusts
      # localhost automatically, so this only surfaces once containerized.
      AUTH_TRUST_HOST: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
